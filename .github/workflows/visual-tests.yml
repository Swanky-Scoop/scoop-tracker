name: Visual regression tests

# Path-filtered so this doesn't run on every unrelated PHP/docs change — only
# when the stylesheet under test or the test harness itself moves.
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/css.css'
      - 'tests/visual/**'
      - '.github/workflows/visual-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    # Official Playwright image, not "install playwright on ubuntu-latest" —
    # this is what actually gets you the deterministic font/subpixel
    # rendering the Mac/Windows-vs-Linux problem needs. The tag's version
    # MUST match the @playwright/test version in tests/visual/package.json
    # exactly (see tests/visual/README.md) — a mismatched browser/test-runner
    # pair is a common, confusing source of spurious diffs or hard failures.
    container:
      # Digest-pinned (2026-08-29) to the v1.48.2-jammy tag as it exists
      # TODAY. The tag is mutable — Microsoft re-pushes it with base-package
      # updates, which silently changed font/subpixel rendering after
      # 2026-08-20 and made every screenshot fail against the (old-runner)
      # baselines. A future drift now changes THIS line and fails loudly
      # here, instead of failing every screenshot. If you bump the image,
      # re-run `npx playwright test --update-snapshots` in the new image
      # and commit the refreshed baselines in the same PR.
      image: mcr.microsoft.com/playwright@sha256:96dc479be9a603227fafc7126bd7d5e8152ae3e63749f377b2c49a4314b28ae1
      # Chromium under Docker's default 64MB /dev/shm frequently crashes on
      # anything non-trivial; --ipc=host is the standard fix recommended by
      # Playwright's own Docker docs.
      options: --ipc=host

    defaults:
      run:
        working-directory: tests/visual

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Run visual regression tests
        run: npx playwright test

      # Only uploaded when something actually failed — see css.css's own
      # `.gitignore`-style split: passing runs don't need artifacts at all.
      - name: Upload diff report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/visual/playwright-report/
          retention-days: 14

      - name: Upload raw diff images (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/visual/test-results/
          retention-days: 14
