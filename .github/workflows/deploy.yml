name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "test-ink"
        type: choice
        options:
          - ops
          - test-ink
          - ops-ink

env:
  REMOTE_HOST: swankyscoop.net
  REMOTE_PORT: "21098"
  REMOTE_USER: swannvoe
  REMOTE_HOST_INK: swanky.ink
  REMOTE_PORT_INK: "21098"
  REMOTE_USER_INK: swanqpgx
  # rsync flags. No --delete: matches current VS Code SFTP behavior
  # (local deletions don't remove remote files).
  RSYNC_ARGS: "-rltvz"

jobs:
  deploy-ops:
    name: Deploy to OPS (swankyscoop.net, production)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ops'
    runs-on: ubuntu-latest
    environment: ops
    concurrency:
      group: deploy-ops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SFTP_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to ops.swankyscoop.net via rsync
        run: |
          rsync $RSYNC_ARGS \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.claude' \
            --exclude='triage' \
            --exclude='data-exports' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='assets/icon-font/svg' \
            --exclude='*.md' \
            --exclude='_domain.json' \
            --exclude='response.json' \
            --exclude='*_response.json' \
            --exclude='dump.txt' \
            --exclude='.prittierrc' \
            --exclude='scoop-deploy-key*' \
            --exclude='*.pem' \
            --exclude='*_rsa' \
            --exclude='*_ed25519' \
            --exclude='id_*' \
            -e "ssh -p $REMOTE_PORT" \
            ./ "$REMOTE_USER@$REMOTE_HOST:/home/swannvoe/ops.swankyscoop.net/wp-content/plugins/scoop_rest/"

  deploy-test-ink:
    name: Deploy to TEST (swanky.ink)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test-ink')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test-ink
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPS_INK }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$REMOTE_PORT_INK" "$REMOTE_HOST_INK" >> ~/.ssh/known_hosts

      - name: Deploy to test.swanky.ink via rsync
        run: |
          rsync $RSYNC_ARGS \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.claude' \
            --exclude='triage' \
            --exclude='data-exports' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='assets/icon-font/svg' \
            --exclude='*.md' \
            --exclude='_domain.json' \
            --exclude='response.json' \
            --exclude='*_response.json' \
            --exclude='dump.txt' \
            --exclude='.prettierrc' \
            --exclude='scoop-deploy-key*' \
            --exclude='*.pem' \
            --exclude='*_rsa' \
            --exclude='*_ed25519' \
            --exclude='id_*' \
            -e "ssh -p $REMOTE_PORT_INK" \
            ./ "$REMOTE_USER_INK@$REMOTE_HOST_INK:/home/swanqpgx/test.swanky.ink/wp-content/plugins/scoop_rest/"

  deploy-ops-ink:
    name: Deploy to OPS (swanky.ink, production)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ops-ink'
    runs-on: ubuntu-latest
    environment: ops
    concurrency:
      group: deploy-ops-ink
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPS_INK }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$REMOTE_PORT_INK" "$REMOTE_HOST_INK" >> ~/.ssh/known_hosts

      - name: Deploy to ops.swanky.ink via rsync
        run: |
          rsync $RSYNC_ARGS \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.claude' \
            --exclude='triage' \
            --exclude='data-exports' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='assets/icon-font/svg' \
            --exclude='*.md' \
            --exclude='_domain.json' \
            --exclude='response.json' \
            --exclude='*_response.json' \
            --exclude='dump.txt' \
            --exclude='.prittierrc' \
            --exclude='scoop-deploy-key*' \
            --exclude='*.pem' \
            --exclude='*_rsa' \
            --exclude='*_ed25519' \
            --exclude='id_*' \
            -e "ssh -p $REMOTE_PORT_INK" \
            ./ "$REMOTE_USER_INK@$REMOTE_HOST_INK:/home/swanqpgx/ops.swanky.ink/wp-content/plugins/scoop_rest/"
