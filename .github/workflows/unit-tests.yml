name: Unit tests

# Runs tests/unit (the two Node suites + the PHP parser suite) on every push
# to main, every pull request, and pushes to worktree-tub-moving (the
# long-lived arc branch where most work lands before its PR to main).
#
# DELIBERATELY not path-filtered: visual-tests.yml's path filter is why its
# baselines silently went stale (main pushes skipped it for weeks; #31 merged
# through a suite nobody had seen run). A suite that only runs "when
# relevant" is documentation, not a gate. The whole unit layer takes seconds.
#
# Pure test job: this workflow deploys nothing, ever. It deliberately does
# NOT gate the deploy jobs — see deploy.yml (lint.yml's workflow_call pattern
# there is how a check gets wired into the deploy jobs if that is ever
# wanted).
#
# The node-version: 22 pin is load-bearing, not cosmetic: the suites import
# ESM from assets/*.js and rely on node's module-syntax detection (node
# >= 21.3); on node 20 they fail with a CJS named-export error before any
# flag matters (see tests/unit/README.md). Do not trust the runner's default
# node.
#
# The second job below (behavior-tests) drives the REAL client components in
# headless Chromium — tests/visual's browser-BEHAVIOR specs (selection state,
# no screenshots, no fonts needed, hence plain ubuntu-latest rather than the
# digest-pinned Playwright image the screenshot specs require). Selected by
# the @behavior tag so the screenshot specs stay in visual-tests.yml where
# their image pin lives. Same reason this workflow has no path filter: an
# assets/ui/ regression is invisible to visual-tests.yml's css.css filter.

on:
  push:
    branches:
      - main
      - worktree-tub-moving
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # run-all.mjs SKIPS the PHP suite (visible note, exit 0) when php is
      # absent — right for a dev box, wrong for CI: this gate exists to
      # execute the /debt-requests parser, the seam that just had a real
      # bug (aaaa3b). Install php-cli explicitly, then assert it is on PATH
      # in the run step below, so a botched install can never degrade CI
      # into a green run that never ran the parser.
      - name: Install php-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli

      - name: Run tests/unit
        run: |
          php --version
          node tests/unit/run-all.mjs

  # Browser-behavior gate: the visual suite's behavior specs, which assert
  # component STATE in real Chromium (not pixels), so they don't need the
  # digest-pinned font-deterministic image that the screenshot specs need —
  # a plain runner with `npx playwright install chromium` is enough. Grep is
  # the selector (a spec tags itself @behavior in a describe title) because
  # @playwright/test has no per-spec include-tags at this version; --list
  # first proves the selector matches ≥1 spec, so a tag typo can never
  # degrade this job into a green run that ran nothing.
  behavior-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/visual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run behavior specs
        run: |
          npx playwright test --list -g "@behavior" | tee /tmp/list.out
          count=$(grep -c '^\s*\[' /tmp/list.out || true)
          echo "behavior specs matched: $count"
          if [ "$count" -lt 1 ]; then echo "::error::@behavior selector matched no specs"; exit 1; fi
          npx playwright test -g "@behavior"
