name: Error-log collector (diagnostics)

# TEMPORARY, READ-ONLY diagnostics workflow — staged for ONE manual run, to
# be removed from its branch (never merged) as soon as it has collected.
#
# WHY: production 500s on the tub-swap flow. Round 2 established the PHP
# error_log has NO fatal/stack-trace in the Sep 3–4 window (WP_DEBUG off;
# modern WP REST catches Throwable → 500 JSON without logging). The
# request-level evidence must come from the cPanel ACCESS logs: exact
# failing URI + status + second, then correlated against the plugin's
# audit-log ("Inventory change logged") timestamps to see how far each
# failing request got.
#
# READ-ONLY: ls / find / stat / grep / awk / zcat / tail only. No writes,
# no deletes, no artifact upload — output stays in the job log.

on:
  push:
    branches:
      - diagnostics/error-log-tail

permissions:
  contents: read

env:
  REMOTE_HOST_INK: swanky.ink
  REMOTE_PORT_INK: "21098"
  REMOTE_USER_INK: swanqpgx

jobs:
  collect-access:
    name: Access-log hunt — ops + test.swanky.ink (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPS_INK }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$REMOTE_PORT_INK" "$REMOTE_HOST_INK" >> ~/.ssh/known_hosts

      - name: Access logs + PHP-log slice — OPS production
        run: |
          cat > /tmp/collect3.sh <<'COLLECT'
          #!/usr/bin/env bash
          # READ-ONLY collector: ls/find/stat/grep/awk/zcat/tail only.
          home="$1"; docroot="$2"; label="$3"
          say() { echo; echo "================ $label :: $1 ================"; }

          say "home layout (top level)"
          ls -la "$home" 2>/dev/null | head -40

          say "candidate access-log locations"
          for d in "$home/logs" "$home/access-logs" "$home/etc"; do
            echo "---- $d ----"
            find "$d" -maxdepth 2 \( -type f -o -type l \) -printf '%TY-%Tm-%Td %TH:%TM %12s  %p -> %l\n' 2>/dev/null | sort -k3 -rn | head -40
          done

          say "5xx + scoop POST lines from ops domain access logs (Sep 2-4)"
          for L in $(find "$home/logs" "$home/access-logs" -maxdepth 2 \( -type f -o -type l \) 2>/dev/null | grep -iE 'ops\.swanky\.ink|ops\.swankyscoop' | head -8); do
            echo "==== $L (size $(stat -c %s "$L" 2>/dev/null)) ===="
            ( zcat -f "$L" 2>/dev/null || cat "$L" ) 2>/dev/null | awk '$9 ~ /^5/ && $0 ~ /\[0[234]\/Sep\/2026/' | tail -100
            echo "---- (same log) POST /wp-json/scoop lines, last 80 ----"
            ( zcat -f "$L" 2>/dev/null || cat "$L" ) 2>/dev/null | grep -E '"POST /wp-json/scoop' | tail -80
          done

          say "PHP error_log Sep 2-4 EXCLUDING _routes.php noise (all lines)"
          awk '/^\[(02|03|04)-Sep-2026/ && !/_routes\.php/' "$docroot/error_log" 2>/dev/null | tail -250

          say "PHP error_log Sep 2-4 message-type histogram"
          awk '/^\[(02|03|04)-Sep-2026/ && !/_routes\.php/' "$docroot/error_log" 2>/dev/null | sed -E 's/^\[[^]]+\] //; s/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -20

          say "wflogs / litespeed state (listing only)"
          ls -la "$docroot/wp-content/wflogs" 2>/dev/null | head -12
          ls -la "$docroot/wp-content/litespeed" 2>/dev/null | head -12
          COLLECT
          ssh -p "$REMOTE_PORT_INK" "$REMOTE_USER_INK@$REMOTE_HOST_INK" "bash -s" /home/swanqpgx /home/swanqpgx/ops.swanky.ink "OPS.swanky.ink PRODUCTION" < /tmp/collect3.sh

      - name: Access logs + PHP-log slice — TEST
        run: |
          cat > /tmp/collect3.sh <<'COLLECT'
          #!/usr/bin/env bash
          home="$1"; docroot="$2"; label="$3"
          say() { echo; echo "================ $label :: $1 ================"; }
          say "candidate access-log locations"
          for d in "$home/logs" "$home/access-logs"; do
            echo "---- $d ----"
            find "$d" -maxdepth 2 \( -type f -o -type l \) -printf '%TY-%Tm-%Td %TH:%TM %12s  %p -> %l\n' 2>/dev/null | sort -k3 -rn | head -40
          done
          say "5xx + scoop POST lines from test domain access logs (Sep 2-4)"
          for L in $(find "$home/logs" "$home/access-logs" -maxdepth 2 \( -type f -o -type l \) 2>/dev/null | grep -iE 'test\.swanky\.ink' | head -8); do
            echo "==== $L (size $(stat -c %s "$L" 2>/dev/null)) ===="
            ( zcat -f "$L" 2>/dev/null || cat "$L" ) 2>/dev/null | awk '$9 ~ /^5/ && $0 ~ /\[0[234]\/Sep\/2026/' | tail -100
            echo "---- (same log) POST /wp-json/scoop lines, last 80 ----"
            ( zcat -f "$L" 2>/dev/null || cat "$L" ) 2>/dev/null | grep -E '"POST /wp-json/scoop' | tail -80
          done
          say "PHP error_log Sep 3-4 EXCLUDING _routes.php noise"
          awk '/^\[(03|04)-Sep-2026/ && !/_routes\.php/' "$docroot/error_log" 2>/dev/null | tail -200
          COLLECT
          ssh -p "$REMOTE_PORT_INK" "$REMOTE_USER_INK@$REMOTE_HOST_INK" "bash -s" /home/swanqpgx /home/swanqpgx/test.swanky.ink "TEST.swanky.ink" < /tmp/collect3.sh
