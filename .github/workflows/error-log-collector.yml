name: Error-log collector (diagnostics)

# TEMPORARY, READ-ONLY diagnostics workflow — staged for ONE manual run, to
# be removed from its branch (never merged) as soon as it has collected.
#
# WHY: production 500s on the tub-swap flow (CabinetWorkflow Confirm Swap /
# /tubs or /Cabinet POST). One real stack trace confirms or kills the ranked
# hypothesis (cabinet-slot.php post_save chain: mark_tub_moving /
# flavor_request topup / dedupe_other_slots). Logs live on the cPanel host,
# reachable only via the deploy SSH keys — this reuses EXACTLY that
# credential plane (secrets.OPS_INK, swanky.ink:21098) for a fixed set of
# READ-ONLY commands (find / stat / grep / tail / wc). No writes, no
# deletes, no artifact upload — output stays in the job log.
#
# Round 2: remote logic runs as a script piped to `ssh bash -s` (no nested
# quoting), log discovery by exact name (cPanel's dot-less `error_log`),
# per-day activity counts, hook-name greps, and corrected JS asset paths.

on:
  push:
    branches:
      - diagnostics/error-log-tail

permissions:
  contents: read

env:
  REMOTE_HOST_INK: swanky.ink
  REMOTE_PORT_INK: "21098"
  REMOTE_USER_INK: swanqpgx

jobs:
  collect-logs:
    name: Tail error logs — ops + test.swanky.ink (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPS_INK }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$REMOTE_PORT_INK" "$REMOTE_HOST_INK" >> ~/.ssh/known_hosts

      - name: Collect (read-only) — OPS production
        run: |
          cat > /tmp/collect.sh <<'COLLECT'
          #!/usr/bin/env bash
          # READ-ONLY collector: find/stat/grep/tail/wc only.
          root="$1"; label="$2"
          say() { echo; echo "================ $label :: $1 ================"; }

          say "log files under docroot (maxdepth 4, non-empty, newest first)"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c -printf '%TY-%Tm-%Td %TH:%TM %10s  %p\n' 2>/dev/null | sort -r | head -20

          say "log files one level above docroot (cPanel home)"
          find "$root/.." -maxdepth 1 -type f \( -name 'error_log*' -o -name '*.log' \) -size +0c -printf '%TY-%Tm-%Td %TH:%TM %10s  %p\n' 2>/dev/null | head -10

          say "tails of the newest error logs"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c 2>/dev/null | while read -r f; do
            echo "---- $(stat -c '%y' "$f" 2>/dev/null)  $f  ($(wc -l < "$f" 2>/dev/null) lines) ----"
            tail -n 250 "$f" 2>/dev/null
          done

          say "error-logging config (.htaccess / .user.ini / wp-config WP_DEBUG lines only)"
          grep -nE 'error_log|display_errors|error_reporting' "$root/.htaccess" "$root/.user.ini" 2>/dev/null
          grep -nE 'WP_DEBUG|error_reporting' "$root/wp-config.php" 2>/dev/null

          say "per-day error counts (recent days) in each log"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' \) -size +0c 2>/dev/null | while read -r f; do
            echo "---- $f ----"
            for d in 28-Aug 29-Aug 30-Aug 31-Aug 01-Sep 02-Sep 03-Sep 04-Sep 05-Sep; do
              n=$(grep -c "\[$d-2026" "$f" 2>/dev/null || true)
              echo "  $d-2026: $n"
            done
          done

          say "hook-chain / fatal grep across docroot logs (tail 200)"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c 2>/dev/null | while read -r f; do
            echo "---- $f ----"
            grep -nE 'Fatal error|Uncaught|PHP (Warning|Notice|Fatal)|Stack trace|cabinet-slot|tub-state|_write_fields|rest\.php|pods|mark_tub|reconcile|topup|dedupe|confirm' "$f" 2>/dev/null | tail -n 200
          done

          say "deployed plugin state (which code is live)"
          plug="$root/wp-content/plugins/scoop_rest"
          stat -c '%y  %n' "$plug/scoop_rest.php" 2>/dev/null
          for js in assets/models/cabinet-workflow-grid-model.js assets/ui/confirm-swap-modal.js; do
            p="$plug/$js"
            if [ -f "$p" ]; then
              stat -c '%y  %n' "$p"
              echo "  planTubChange hits: $(grep -c 'planTubChange' "$p" 2>/dev/null)"
              grep -n "_defaultFlavorId" "$p" 2>/dev/null | head -3
            else
              echo "  MISSING: $p"
            fi
          done
          COLLECT
          ssh -p "$REMOTE_PORT_INK" "$REMOTE_USER_INK@$REMOTE_HOST_INK" "bash -s" /home/swanqpgx/ops.swanky.ink "OPS.swanky.ink PRODUCTION" < /tmp/collect.sh

      - name: Collect (read-only) — TEST
        run: |
          cat > /tmp/collect.sh <<'COLLECT'
          #!/usr/bin/env bash
          root="$1"; label="$2"
          say() { echo; echo "================ $label :: $1 ================"; }

          say "log files under docroot (maxdepth 4, non-empty, newest first)"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c -printf '%TY-%Tm-%Td %TH:%TM %10s  %p\n' 2>/dev/null | sort -r | head -20

          say "tails of the newest error logs"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c 2>/dev/null | while read -r f; do
            echo "---- $(stat -c '%y' "$f" 2>/dev/null)  $f  ($(wc -l < "$f" 2>/dev/null) lines) ----"
            tail -n 250 "$f" 2>/dev/null
          done

          say "hook-chain / fatal grep across docroot logs (tail 200)"
          find "$root" -maxdepth 4 -type f \( -name 'error_log' -o -name 'error_log.*' -o -name '*.log' -o -name 'debug.log' \) -size +0c 2>/dev/null | while read -r f; do
            echo "---- $f ----"
            grep -nE 'Fatal error|Uncaught|PHP (Warning|Notice|Fatal)|Stack trace|cabinet-slot|tub-state|_write_fields|rest\.php|pods|mark_tub|reconcile|topup|dedupe|confirm' "$f" 2>/dev/null | tail -n 200
          done

          say "deployed plugin state"
          plug="$root/wp-content/plugins/scoop_rest"
          stat -c '%y  %n' "$plug/scoop_rest.php" 2>/dev/null
          for js in assets/models/cabinet-workflow-grid-model.js assets/ui/confirm-swap-modal.js; do
            p="$plug/$js"
            if [ -f "$p" ]; then
              stat -c '%y  %n' "$p"
              echo "  planTubChange hits: $(grep -c 'planTubChange' "$p" 2>/dev/null)"
            else
              echo "  MISSING: $p"
            fi
          done
          COLLECT
          ssh -p "$REMOTE_PORT_INK" "$REMOTE_USER_INK@$REMOTE_HOST_INK" "bash -s" /home/swanqpgx/test.swanky.ink "TEST.swanky.ink" < /tmp/collect.sh
