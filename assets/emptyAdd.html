<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo CaGrouped Tile</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <div class="modal confirm_swap">
    <form>
      <button class="close">X</button>
      <p>Replace flavor</p>
      <h2>Almond Croissant</h2>
      <p>with</p>
      <div class="img almond_crissant">
        <img src="path/to/photo.webp" alt="Photo for the flavor" />
        <h3>Almond Croissant</h3>
        <p>2026-05-06 00:15_4|4</p>
      </div>
      <label>
        <input type="checkbox" id="partial" checked="checked" />
        Use full tubs before partial tubs.
      </label>
      <p class="current">
        There are <b>2</b> remaining tubs, <b>2</b> are here.
      </p>
      <p class="next">
        Next scheduled flavor is <h4><a href="#confirm_other_tub_flavor">Butter Peacan Baklava</a></h4>
        It has <b>2</b> remaining tubs, <b>2</b> are here.
      </p>
      <p class="btn_group">
        <button class="confirm">Confirm Swap</button>
        <button class="other">Change Plan</button>
      </p>
      <p class="none"><button class="empty">Click here to leave slot empty.</button></p>
    </form>
  </div>
</body>
</html>
